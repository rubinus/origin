apiVersion : apps/v1
kind: Deployment
metadata:
  name: origin 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: origin
  template:
    metadata:
      labels:
        app: origin 
    spec:
      containers:
        - name: origin 
          image: origin.azurecr.io/origin
          ports:
          - containerPort: 80